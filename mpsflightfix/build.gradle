plugins {
	id 'com.unascribed.nilgradle' version '1.4.4'
}

sourceCompatibility = 8
targetCompatibility = 8
compileJava.options.encoding = 'UTF-8'

group = 'com.nao'
archivesBaseName = 'mpsflightfix'
version = '2.0.0'

repositories {
	mavenCentral {
		content {
			includeGroup 'org.lwjgl.lwjgl'
		}
	}
	maven {
		url 'https://repo.sleeping.town'
		content {
			includeGroup 'com.unascribed'
		}
	}
	maven {
		url 'https://maven.minecraftforge.net'
		metadataSources {
			artifact()
		}
		content {
			includeGroup 'net.minecraftforge'
		}
	}
	flatDir {
		dirs 'libs'
		content {
			includeGroup 'libs'
		}
	}
}

nil {
	id "mpsflightfix"
	// standalone=true: bundle NilLoader inside our jar so the user only drops a single file
	// in their mods/ folder. No separate NilLoader install needed.
	standalone true
}

dependencies {
	loader 'com.unascribed:nilloader:1.3.1'

	implementation('org.lwjgl.lwjgl:lwjgl:2.9.3') {
		transitive = false
	}

	game nil.minecraft('1.4.7', 'client')
	mod 'net.minecraftforge:forge:1.4.7-6.6.2.534:universal@zip'
	mod 'libs:ModularPowersuits'
}

mappings {
	work 'com.unascribed:unknownthingy:1.19@tsrg'
}
