buildscript {
	repositories {
		mavenCentral()
		maven { url "https://maven.fabricmc.net" }
		maven { url "https://repo.sleeping.town" }
	}
	dependencies {
		classpath "agency.highlysuspect:voldeloom:2.4"
	}
}

apply plugin: "agency.highlysuspect.voldeloom"

java.toolchain.languageVersion = JavaLanguageVersion.of(11)
compileJava.options.release.set(6)
compileJava.options.encoding = 'UTF-8'

group = 'com.quarryrange'
archivesBaseName = 'quarryrange'
version = '1.0.1'

String minecraftVersion = "1.4.7"
String forgeVersion = "1.4.7-6.6.2.534"

repositories {
	mavenCentral()
	flatDir {
		dirs 'libs'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraftVersion}"
	forge "net.minecraftforge:forge:${forgeVersion}:universal@zip"
	mappings "net.minecraftforge:forge:${forgeVersion}:src@zip"

	// BuildCraft is accessed purely by reflection at runtime (no compile-time imports),
	// so no BuildCraft jar is needed on the classpath. Any helper jars dropped in libs/
	// would be resolved here.
	compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

volde {
	// default config; nothing to override.
}

// Deploy to the dev client + the pack's mods/ (same targets as the other mods). The hold/apply
// logic is server-side, so the server needs the jar too. Missing targets are skipped rather than
// failing the build. Older builds of ourselves are removed first so FML never sees the mod id
// twice. NOT the unsup-managed "The Favoured Craft" instance: unsup would re-download the indexed
// version next to the new one and crash on the duplicate — that instance gets it via the pack.
def deployTargets = [
	file("C:/Users/Nao/AppData/Roaming/PrismLauncher/instances/Ultimate Remastered/minecraft/mods"),
	file("C:/Users/Nao/Desktop/ultimate-remastered/mods")
]

task installToMods {
	dependsOn remapJarForRelease
	doLast {
		def src = remapJarForRelease.archivePath
		deployTargets.each { dir ->
			if (!dir.exists()) {
				println "[installToMods] SKIP (missing): ${dir}"
				return
			}
			dir.listFiles().each { f ->
				if (f.name ==~ /quarryrange-.*\.jar/ && f.name != src.name && f.delete()) {
					println "[installToMods] Removed stale ${f.name}"
				}
			}
			copy { from src; into dir }
			println "[installToMods] Copied ${src.name} -> ${dir}"
		}
	}
}
build.finalizedBy installToMods
