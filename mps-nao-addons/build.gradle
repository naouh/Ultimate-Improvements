buildscript {
	repositories {
		mavenCentral()
		maven { url "https://maven.fabricmc.net" }
		maven { url "https://repo.sleeping.town" }
	}
	dependencies {
		classpath "agency.highlysuspect:voldeloom:2.4"
	}
}

apply plugin: "agency.highlysuspect.voldeloom"

java.toolchain.languageVersion = JavaLanguageVersion.of(11)
compileJava.options.release.set(6)
compileJava.options.encoding = 'UTF-8'

group = 'com.nao.mpsnaoaddons'
archivesBaseName = 'mps-nao-addons'
version = '1.0.1'

String minecraftVersion = "1.4.7"
String forgeVersion = "1.4.7-6.6.2.534"

repositories {
	mavenCentral()
	flatDir {
		dirs 'libs'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraftVersion}"
	forge "net.minecraftforge:forge:${forgeVersion}:universal@zip"
	mappings "net.minecraftforge:forge:${forgeVersion}:src@zip"

	// MPS jar needed for compile-time references to its classes
	// (PowerModule, ModuleManager, ItemComponent, etc.).
	compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

// Coremod manifest: tells FML this jar contains an IFMLLoadingPlugin.
jar {
	manifest {
		attributes(
			'FMLCorePlugin': 'com.nao.mpsnaoaddons.MpsNaoAddonsCorePlugin',
			'FMLCorePluginContainsFMLMod': 'true'
		)
	}
}

volde {
	// default config
}

// After every successful build, drop the remapped jar into the PrismLauncher
// "Ultimate Remastered" instance's coremods folder and the pack's coremods
// folder (both sides run it), replacing any older build of ourselves so FML
// never sees the mod id twice. The remapped artifact is the one without the
// -dev suffix (remapJarForRelease produces it from the -dev jar).
def deployTargets = [
	file("C:/Users/Nao/AppData/Roaming/PrismLauncher/instances/Ultimate Remastered/minecraft/coremods"),
	file("C:/Users/Nao/Desktop/ultimate-remastered/coremods")
]

task installToCoremods {
	dependsOn remapJarForRelease
	doLast {
		def src = remapJarForRelease.archivePath
		deployTargets.each { dir ->
			if (!dir.exists()) {
				println "[installToCoremods] SKIP (missing): ${dir}"
				return
			}
			dir.listFiles().each { f ->
				if (f.name ==~ /mps-nao-addons-.*\.jar/ && f.name != src.name && f.delete()) {
					println "[installToCoremods] Removed stale ${f.name}"
				}
			}
			copy { from src; into dir }
			println "[installToCoremods] Copied ${src.name} -> ${dir}"
		}
	}
}
build.finalizedBy installToCoremods
