# ItemGuard configuration.
#
# Everything is keyed by item/block ID. Each key may be:
#   - a bare ID      -> 243      matches that ID with ANY data value
#   - an ID:data pair-> "243:1"  matches ONLY that subtype (data/damage value)
# This works for both vanilla and modded items, so mods that pack many items onto a
# single ID (Railcraft anchors, etc.) can be targeted precisely.
#
# IMPORTANT: an ID:data value MUST be quoted -> "243:1".
#   Unquoted, YAML reads 243:1 as a base-60 number (243*60+1 = 14581), not "243 data 1".
# IMPORTANT: YAML does not allow TAB characters for indentation - use spaces only.
# Tip: hold the item in-game and run "/itemguard count" - it prints its ID:data.
#
# Players with the itemguard.bypass permission ignore every rule below.

# --- Blacklist ---------------------------------------------------------------
# A GLOBAL entry (no "@world" suffix) can NOT be crafted and can NOT be placed,
# in any world. A WORLD-SCOPED entry ("@world") only blocks PLACEMENT in those
# worlds - the item can still be crafted and carried (you can't scope a craft to
# a world, since items move freely between worlds).
#
# World scoping (optional): append "@world1,world2" to an entry to block its
# PLACEMENT ONLY in those worlds. With no "@..." suffix the item is blocked
# (craft + place) in EVERY world.
#   - the world checked is the one the block is placed in.
#   - world names are matched case-insensitively (e.g. world, world_nether).
#   - an entry WITH a "@" suffix MUST be quoted -> "901@world".
#   - list the same ID twice to block it in several specific worlds, e.g.
#       - "901@world"
#       - "901@mining"
#     (and a bare "901" anywhere makes it blocked everywhere regardless).
blacklist:
  # - 7              # bedrock, blocked in every world
  # - "243:1"        # only data value 1 of item 243, every world
  # - "901@world"    # e.g. block PLACING the BuildCraft Quarry only in the 'world'
                     #      (overworld); it can still be crafted and placed elsewhere
  # - "901@world,world_nether"   # block it in two specific worlds

# --- Placement limits --------------------------------------------------------
# How many of a given block a single player may have placed in the world at once.
# Breaking one of your own placed blocks frees a slot again.
#
# For each key:
#   default     -> limit applied to everyone (use 0 to forbid placing by default)
#   permissions -> per-permission overrides; the HIGHEST limit the player has wins.
#
# Assign the permission nodes to your groups (builder, donator, ...) in your
# permissions plugin. Example below: chunk loader = 2 by default, 3 for donators.
limits:
  # 243:                       # Chunk Loader (any data value)
  #   default: 2
  #   permissions:
  #     itemguard.limit.donator: 3
